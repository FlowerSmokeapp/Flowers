# Lægger Pause-AI-serveren (ai-server/) op på Cloudflare Workers.
# Kræver tre hemmeligheder under Settings → Secrets and variables → Actions:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID og ANTHROPIC_API_KEY.
name: Deploy Pause-AI

on:
  push:
    branches: [main]
    paths: ["ai-server/**", ".github/workflows/deploy-ai.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: ai-server
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-server
          wranglerVersion: "4.149.0"
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
