# Sender push-notifikationer hvert 5. minut (GitHub kan forsinke kørslerne lidt)
name: Push-notifikationer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: push
      - run: node send.mjs
        working-directory: push
        env:
          PUSH_EMAIL: ${{ secrets.PUSH_EMAIL }}
          PUSH_PASSWORD: ${{ secrets.PUSH_PASSWORD }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
